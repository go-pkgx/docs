site_name: go-pkgx docs
site_description: "A dependency-free, pure-Go (CGO=0) package manager for pkgx bottles — runs on FROM scratch."
site_url: https://go-pkgx.github.io/docs/
repo_url: https://github.com/go-pkgx/pkgm
repo_name: go-pkgx/pkgm
edit_uri: ""

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg
  features:
    - navigation.sections
    - navigation.top
    - navigation.instant
    - content.code.copy
    - search.suggest
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: amber
      toggle:
        icon: material/brightness-4
        name: Switch to system preference

extra:
  version:
    provider: mike
    default: latest

nav:
  - Home: index.md
  - FROM scratch: from-scratch.md
  - Environments and HPC: environments.md
  - Package registry: registry.md
  - Supply chain: supply-chain.md
  - Build isolation: build-isolation.md
  - Windows: windows.md


markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
